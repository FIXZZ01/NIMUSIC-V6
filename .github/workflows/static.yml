# V2 by nanas workflow - Optimized for High Performance & Production
name: V2 Deploy Static to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Build, Optimize & Audit
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛡️ Audit Dependencies (Security Check)
        run: npm audit --audit-level=high --production
        continue-on-error: true # Menghindari workflow gagal total hanya karena peringatan minor

      - name: 🏗️ Build production bundle
        run: npm run build --if-present

      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Ganti dengan folder hasil build Anda (misal: './dist' atau './build') jika ada
          path: '.' 

  # Job 2: Secure & Fast Deployment
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 🎉 Deployment Success Summary
        if: success()
        run: |
          echo "### V2 Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "Website Anda telah diperbarui dan aktif di: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
